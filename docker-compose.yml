name: profolio

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: profolio-worker:local
    ports:
      - "${PROFOLIO_PORT:-8787}:8787"
    volumes:
      - type: bind
        source: ./.dev.vars
        target: /app/.dev.vars
        read_only: true
        bind:
          create_host_path: false
      - profolio-wrangler-state:/app/.wrangler
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8787/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  profolio-wrangler-state:
